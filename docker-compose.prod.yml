x-common-env: &common_env
  - ${ZEAPLAY_ENV_FILE:-.env.production}

x-common-restart: &common_restart
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    container_name: zeaplay_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *common_restart

  redis:
    image: redis:7-alpine
    container_name: zeaplay_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *common_restart

  backend:
    build:
      context: ./backend
    container_name: zeaplay_backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "6311", "--workers", "${VEE_API_WORKERS:-1}", "--ws-max-size", "${VEE_WEBSOCKET_MAX_MESSAGE_BYTES:-65536}", "--ws-max-queue", "${UVICORN_WS_MAX_QUEUE:-16}"]
    env_file: *common_env
    environment:
      VEE_ENVIRONMENT: production
      VEE_OAUTH_ISSUER: ${VEE_OAUTH_ISSUER:-}
      VEE_OAUTH_UI_URL: ${VEE_OAUTH_UI_URL:-}
      VEE_OAUTH_AUDIENCE: ${VEE_OAUTH_AUDIENCE:-zeaplay-api}
      VEE_PASSWORD_RESET_URL: ${VEE_PASSWORD_RESET_URL:-}
      VEE_BROWSER_SESSION_HTTP_ORIGINS: '${VEE_BROWSER_SESSION_HTTP_ORIGINS:-[]}'
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      VEE_DATABASE_URL: ${VEE_DATABASE_URL}
      VEE_REDIS_URL: ${VEE_REDIS_URL}
      VEE_CACHE_REDIS_URL: ${VEE_CACHE_REDIS_URL}
      VEE_JWT_SECRET_KEY: ${VEE_JWT_SECRET_KEY}
      VEE_JWT_REFRESH_SECRET_KEY: ${VEE_JWT_REFRESH_SECRET_KEY}
      VEE_TASK_LIST_CACHE_TTL_SECONDS: ${VEE_TASK_LIST_CACHE_TTL_SECONDS}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY}
      GUNICORN_THREADS: ${GUNICORN_THREADS}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT}
      GUNICORN_KEEPALIVE: ${GUNICORN_KEEPALIVE}
      VEE_DB_POOL_SIZE: ${VEE_DB_POOL_SIZE}
      VEE_DB_MAX_OVERFLOW: ${VEE_DB_MAX_OVERFLOW}
      VEE_MAX_REQUEST_BODY_MB: ${VEE_MAX_REQUEST_BODY_MB}
      VEE_CORS_ALLOW_ORIGINS: '${VEE_CORS_ALLOW_ORIGINS}'
      VEE_MINIO_ENDPOINT: ${VEE_MINIO_ENDPOINT}
      VEE_MINIO_ACCESS_KEY: ${VEE_MINIO_ACCESS_KEY}
      VEE_MINIO_SECRET_KEY: ${VEE_MINIO_SECRET_KEY}
      VEE_MINIO_BUCKET_ATTACHMENTS: ${VEE_MINIO_BUCKET_ATTACHMENTS}
      VEE_MINIO_BUCKET_TICKET_ATTACHMENTS: ${VEE_MINIO_BUCKET_TICKET_ATTACHMENTS}
      VEE_MINIO_PUBLIC_BASE: ${VEE_MINIO_PUBLIC_BASE}
      VEE_MEDIA_PRESIGN_RATE_REDIS_URL: ${VEE_MEDIA_PRESIGN_RATE_REDIS_URL}
      VEE_VAPID_PUBLIC_KEY: ${VEE_VAPID_PUBLIC_KEY}
      VEE_VAPID_PRIVATE_KEY: ${VEE_VAPID_PRIVATE_KEY}
      VEE_VAPID_SUBJECT: ${VEE_VAPID_SUBJECT}
    volumes:
      - avatar_media_data:/app/media/.avatars
      - chat_media_data:/app/media/chat
    ports:
      - "127.0.0.1:6311:6311"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    <<: *common_restart

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_PRESENCE_URL: ${VITE_PRESENCE_URL}
        VITE_WS_URL: ${VITE_WS_URL}
        VITE_TICKET_CHAT_WS_URL: ${VITE_TICKET_CHAT_WS_URL}
        VITE_CHAT_URL: ${VITE_CHAT_URL}
    container_name: zeaplay_frontend
    environment:
      API_URL: ${API_URL}
      NGINX_TRUSTED_PROXY_CIDRS: ${NGINX_TRUSTED_PROXY_CIDRS:-}
      PRESENCE_URL: ${PRESENCE_URL}
      CHAT_URL: ${CHAT_URL:-${PRESENCE_URL:-same-origin}}
      WS_URL: ${WS_URL}
      TICKET_CHAT_WS_URL: ${TICKET_CHAT_WS_URL}
    ports:
      - "6300:80"
    depends_on:
      - backend
      - presence
    <<: *common_restart

  presence:
    build:
      context: ./presence-server
    container_name: zeaplay_presence
    environment:
      NODE_ENV: production
      PRESENCE_PORT: ${PRESENCE_PORT}
      PRESENCE_REDIS_URL: ${PRESENCE_REDIS_URL}
      PRESENCE_JWT_SECRET: ${PRESENCE_JWT_SECRET}
      PRESENCE_JWT_ALGORITHM: ${PRESENCE_JWT_ALGORITHM}
      PRESENCE_EVENTS_CHANNEL: ${PRESENCE_EVENTS_CHANNEL}
      PRESENCE_CORS_ORIGINS: ${PRESENCE_CORS_ORIGINS}
      PRESENCE_REQUIRE_ORIGIN: ${PRESENCE_REQUIRE_ORIGIN:-true}
      PRESENCE_ALLOW_LOCALHOST_ORIGINS: ${PRESENCE_ALLOW_LOCALHOST_ORIGINS:-false}
      PRESENCE_MAX_CONNECTIONS_PER_USER: ${PRESENCE_MAX_CONNECTIONS_PER_USER:-12}
      PRESENCE_MAX_TOTAL_CONNECTIONS: ${PRESENCE_MAX_TOTAL_CONNECTIONS:-10000}
      CORS_ORIGINS: ${PRESENCE_CORS_ORIGINS}
    ports:
      - "127.0.0.1:6312:6312"
    depends_on:
      redis:
        condition: service_healthy
    <<: *common_restart

  realtime-relay:
    profiles: ["realtime-outbox"]
    build:
      context: ./backend
    env_file: *common_env
    command: ["python", "-m", "app.realtime.relay"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    <<: *common_restart

volumes:
  postgres_data:
  redis_data:
  avatar_media_data:
  chat_media_data:
