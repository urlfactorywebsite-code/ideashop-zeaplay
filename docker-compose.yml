services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zeaplay
      POSTGRES_USER: zeaplay
      POSTGRES_PASSWORD: zeaplay
    ports:
      - "6432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  backend:
    build:
      context: ./backend
    env_file:
      - path: ./.env.smtp.local
        required: false
      - path: ./.env.push.local
        required: false
      - path: ./.env.oauth.local
        required: false
    environment:
      VEE_DATABASE_URL: postgresql+psycopg://zeaplay:zeaplay@postgres:5432/zeaplay
      VEE_CACHE_REDIS_URL: redis://redis:6379
      VEE_JWT_SECRET_KEY: change_me
      VEE_JWT_REFRESH_SECRET_KEY: change_me_refresh
      VEE_ENVIRONMENT: development
      VEE_CORS_ALLOW_ORIGINS: '["http://localhost:6300","http://127.0.0.1:6300","http://localhost:5173","http://127.0.0.1:5173","http://localhost:3000","http://127.0.0.1:3000"]'
    ports:
      - "6311:6311"
    depends_on:
      - postgres
      - redis

  presence:
    build:
      context: ./presence-server
    environment:
      PRESENCE_PORT: 6312
      PRESENCE_REDIS_URL: redis://redis:6379
      PRESENCE_JWT_SECRET: change_me
      PRESENCE_JWT_ALGORITHM: HS256
      PRESENCE_EVENTS_CHANNEL: presence:events
      PRESENCE_CORS_ORIGINS: http://localhost:6300,http://127.0.0.1:6300,http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "6312:6312"
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:6311/api
        VITE_API_URL: http://localhost:6311/api
        VITE_PRESENCE_URL: http://localhost:6312
        VITE_CHAT_URL: http://localhost:6312
    environment:
      PRESENCE_URL: http://localhost:6312
      CHAT_URL: http://localhost:6312
    ports:
      - "6300:80"
    depends_on:
      - backend
      - presence

volumes:
  postgres_data:
