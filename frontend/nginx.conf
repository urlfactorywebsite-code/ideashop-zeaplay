map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# Only configured proxy peers may describe the original TLS connection.
map "$zea_trusted_proxy:$http_x_forwarded_proto" $zea_forwarded_proto {
  default $scheme;
  "1:https" https;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  # Authorization callbacks can contain one-use codes. Never log query strings.
  access_log off;

  location = /runtime-config.js {
    expires -1;
    try_files $uri =404;
  }

  # Scraping is container-internal; never forward monitoring credentials publicly.
  location ^~ /.well-known/oauth-authorization-server/ {
    proxy_pass http://backend:6311;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $zea_forwarded_proto;
  }
  location ^~ /api/internal/ { return 404; }
  location ^~ /internal/ { return 404; }

  # Proxy native WebSocket endpoints without logging query-string tokens.
  location /api/ws/ {
    access_log off;
    proxy_pass http://backend:6311/ws/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $zea_forwarded_proto;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  # Proxy API calls to FastAPI backend service
  location = /api/notifications/stream {
    proxy_pass http://backend:6311/notifications/stream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $zea_forwarded_proto;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 75s;
  }

  location /api/ {
    proxy_pass http://backend:6311/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $zea_forwarded_proto;
    proxy_set_header X-Forwarded-Host $server_name;
  }

  # Relative public upload links still work when the API uses its own hostname.
  location /uploads/ {
    proxy_pass http://backend:6311/uploads/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $zea_forwarded_proto;
  }
  location /assets/avatars/ {
    proxy_pass http://backend:6311/assets/avatars/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $zea_forwarded_proto;
  }

  # Proxy Socket.IO presence/call signaling through the same public origin.
  location /socket.io/ {
    access_log off;
    proxy_pass http://presence:6312/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $zea_forwarded_proto;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  # Single Page App fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}

# NPM sends both public hosts to this gateway. Preserve the API's root and /api
# aliases, OAuth discovery, uploads, native WebSockets and Socket.IO on its host.
server {
  listen 80;
  server_name api.ideashop.zeacrm.com;
  access_log off;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;

  location ^~ /api/internal/ { return 404; }
  location ^~ /internal/ { return 404; }
  location = /api/health { proxy_pass http://backend:6311/health; }
  location = /api/ready { proxy_pass http://backend:6311/ready; }
  location = /api/openapi.json { proxy_pass http://backend:6311/openapi.json; }

  location /socket.io/ {
    proxy_pass http://presence:6312;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $zea_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_buffering off;
  }

  location / {
    proxy_pass http://backend:6311;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $zea_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }
}
