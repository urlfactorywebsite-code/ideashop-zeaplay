# Append to Advanced for the ideashop.zeacrm.com NPM Proxy Host.
# An exact location wins over NPM's JavaScript asset-cache location.
location = /sw.js {
    proxy_pass http://zeaplay_frontend:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
    proxy_cache_bypass 1;
    proxy_no_cache 1;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    expires -1;
}
