global:
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 10s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: fastapi
    metrics_path: /internal/metrics
    authorization:
      credentials_file: /run/secrets/metrics_token
    static_configs: [{targets: ['backend:6311']}]
  - job_name: presence
    metrics_path: /internal/metrics
    authorization:
      credentials_file: /run/secrets/metrics_token
    static_configs: [{targets: ['presence:6312']}]
  - job_name: realtime-relay
    metrics_path: /internal/metrics
    authorization:
      credentials_file: /run/secrets/metrics_token
    file_sd_configs: [{files: ['/etc/prometheus/relay-targets.json']}]
  - job_name: redis
    static_configs: [{targets: ['redis-exporter:9121']}]
  - job_name: postgres
    scrape_interval: 60s
    static_configs: [{targets: ['postgres-exporter:9187']}]
  - job_name: host
    static_configs: [{targets: ['node-exporter:9100']}]
  - job_name: containers
    static_configs: [{targets: ['cadvisor:8080']}]
